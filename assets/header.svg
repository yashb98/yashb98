<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Yash Bishnoi, ML Engineer">
  <title>Yash Bishnoi — ML Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="239" rx="12" fill="url(#bg)" stroke="#30363d"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="56" y="88" font-size="44" font-weight="600" fill="#e6edf3">Yash Bishnoi</text>
    <text x="58" y="120" font-size="16" font-weight="500" fill="#8b949e" letter-spacing="0.08em">ML ENGINEER &#183; EDINBURGH, SCOTLAND</text>
    <text x="58" y="162" font-size="17" fill="#7d8590">I reproduce language models bit-exact,</text>
    <text x="58" y="186" font-size="17" fill="#7d8590">then run the ablations the papers skip.</text>
    <rect x="58" y="204" width="0" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" from="0" to="260" dur="1.1s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>
  </g>

  <g transform="translate(780 0)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="8" y="56" font-size="13" fill="#6e7681">max|&#916;logits| vs reference</text>
    <line x1="8" y1="192" x2="376" y2="192" stroke="#30363d" stroke-width="1"/>
    <line x1="8" y1="72" x2="376" y2="72" stroke="#21262d" stroke-width="1" stroke-dasharray="3 5"/>
    <line x1="8" y1="132" x2="376" y2="132" stroke="#21262d" stroke-width="1" stroke-dasharray="3 5"/>
    <path d="M8 78 C 90 80, 120 168, 190 183 S 300 192, 372 192"
          fill="none" stroke="url(#curve)" stroke-width="2.5" stroke-linecap="round"
          stroke-dasharray="440" stroke-dashoffset="440">
      <animate attributeName="stroke-dashoffset" from="440" to="0" dur="2.2s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    </path>
    <circle cx="372" cy="192" r="4" fill="#3fb950" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.4s" fill="freeze"/>
      <animate attributeName="r" values="4;7;4" dur="2.4s" begin="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="372" y="176" font-size="15" font-weight="600" fill="#3fb950" text-anchor="end" opacity="0">0.0
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.5s" fill="freeze"/>
    </text>
  </g>
</svg>
